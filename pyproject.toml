[project]
name = "brain-tumor-classification"
version = "0.1.0"
description = "Brain MRI tumor classification (healthy vs tumor) with a small CNN and MobileNetV2, plus an in-browser TF.js demo."
requires-python = ">=3.12,<3.13"
dependencies = [
    "imagehash>=4.3.2",
    "matplotlib>=3.10",
    "numpy>=2.0",
    "pillow>=11.0",
    "scikit-learn>=1.6",
    "scipy>=1.18.1",
    "tensorflow>=2.21.0,<2.22",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/btc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs the downloaded dataset or trained models (skipped in CI)"]
addopts = "-m 'not slow'"
